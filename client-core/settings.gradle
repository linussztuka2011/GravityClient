pluginManagement {
    repositories {
        // Fabric Loom is published to Fabric's own Maven, not the plugin portal.
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

rootProject.name = 'gravity-client-core'
