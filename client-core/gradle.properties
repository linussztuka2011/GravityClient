# Minecraft and Loader versions
# 1.21.11 is the newest release Yarn publishes mappings for; Minecraft's
# year-based versions (26.x) have Loader and API support but no Yarn build yet,
# so the mod cannot target them without switching to Mojang mappings.
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.6
loader_version=0.19.5

# Dependencies
fabric_version=0.141.6+1.21.11
modmenu_version=17.0.0

# Mod Metadata
mod_version=1.0.0
maven_group=net.gravityclient.core
archives_base_name=gravity-client-core
